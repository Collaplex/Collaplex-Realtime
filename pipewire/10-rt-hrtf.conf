# Collaplex RT —— HRTF(FL/FR) + 影院房间 IR
# 占位符: __HRIR__ 脉冲响应目录 / __REVERB__ 房间 IR / __DSP_IN__ 下游 DSP 接入
#
# 左耳 = L·h(FL→L) + R·h(FR→L)，右耳 = L·h(FL→R) + R·h(FR→R)
# 房间：干路 hL/hR，湿路 revL/revR（0.61×0.35 = 0.2135），mixer 相加
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Collaplex RT 输入 (HRTF + 房间)"
            media.name       = "Collaplex RT HRTF"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = iL }
                    { type = builtin label = copy name = iR }
                    { type = builtin label = pipe name = gapL config = { command = "__GAP_L__" } }
                    { type = builtin label = pipe name = gapR config = { command = "__GAP_R__" } }
                    { type = builtin label = convolver name = cFLL config = { filename = "__HRIR__/FL_L.wav" } }
                    { type = builtin label = convolver name = cFLR config = { filename = "__HRIR__/FL_R.wav" } }
                    { type = builtin label = convolver name = cFRL config = { filename = "__HRIR__/FR_L.wav" } }
                    { type = builtin label = convolver name = cFRR config = { filename = "__HRIR__/FR_R.wav" } }
                    { type = builtin label = mixer name = hL control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = mixer name = hR control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
                    { type = builtin label = convolver name = revL config = { filename = "__REVERB__" channel = 0 gain = 0.2135 } }
                    { type = builtin label = convolver name = revR config = { filename = "__REVERB__" channel = 1 gain = 0.2135 } }
                    { type = builtin label = mixer name = wetL control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 0.0 } }
                    { type = builtin label = mixer name = wetR control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 0.0 } }
                ]
                links = [
                    { output = "iL:Out" input = "cFLL:In" }
                    { output = "iL:Out" input = "cFLR:In" }
                    { output = "iR:Out" input = "cFRL:In" }
                    { output = "iR:Out" input = "cFRR:In" }
                    { output = "iL:Out" input = "gapL:In" }
                    { output = "iR:Out" input = "gapR:In" }
                    { output = "cFLL:Out" input = "hL:In 1" }
                    { output = "cFRL:Out" input = "hL:In 2" }
                    { output = "cFLR:Out" input = "hR:In 1" }
                    { output = "cFRR:Out" input = "hR:In 2" }
                    { output = "hL:Out" input = "wetL:In 1" }
                    { output = "hL:Out" input = "revL:In" }
                    { output = "revL:Out" input = "wetL:In 2" }
                    { output = "gapL:Out" input = "wetL:In 3" }
                    { output = "gapR:Out" input = "wetR:In 3" }
                    { output = "hR:Out" input = "wetR:In 1" }
                    { output = "hR:Out" input = "revR:In" }
                    { output = "revR:Out" input = "wetR:In 2" }
                ]
                inputs  = [ "iL:In" "iR:In" ]
                outputs = [ "wetL:Out" "wetR:Out" ]
            }
            capture.props = {
                media.class      = Audio/Sink
                node.name        = collaplex_rt_sink
                node.description = "Collaplex RT 输入"
                audio.channels   = 2
                audio.position   = [ FL FR ]
                node.always-process = true
                node.pause-on-idle  = false
            }
            playback.props = {
                node.name        = collaplex_rt_hrtf_out
                audio.channels   = 2
                audio.position   = [ FL FR ]
                node.target      = "__DSP_IN__"
                node.always-process = true
                node.pause-on-idle  = false
            }
        }
    }
]
