# Collaplex RT —— Rust DSP（搁架/平衡/AGC/限幅）
# 占位符: __DSP__ DSP 可执行 wrapper / __TARGET__ 硬件输出节点
#
# PipeWire 的 pipe 插件按声道 fork：左右各一个 Rust 进程，DSP 内部用
# /dev/shm 共享能量，保证双声道拿到同一个 AGC 增益。
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Collaplex RT DSP"
            media.name       = "Collaplex RT DSP"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = c1L }
                    { type = builtin label = copy name = c1R }
                    { type = builtin label = pipe name = dspL config = { command = "__DSP__" } }
                    { type = builtin label = pipe name = dspR config = { command = "__DSP__" } }
                    { type = builtin label = linear name = gL control = { "Mult" = __BAL_L_MULT__ "Add" = 0.0 } }
                    { type = builtin label = linear name = gR control = { "Mult" = __BAL_R_MULT__ "Add" = 0.0 } }
                    { type = builtin label = copy name = c2L }
                    { type = builtin label = copy name = c2R }
                ]
                links = [
                    { output = "c1L:Out" input = "dspL:In" }
                    { output = "c1R:Out" input = "dspR:In" }
                    { output = "dspL:Out" input = "gL:In" }
                    { output = "dspR:Out" input = "gR:In" }
                    { output = "gL:Out" input = "c2L:In" }
                    { output = "gR:Out" input = "c2R:In" }
                ]
                inputs  = [ "c1L:In" "c1R:In" ]
                outputs = [ "c2L:Out" "c2R:Out" ]
            }
            capture.props = {
                media.class      = Audio/Sink
                node.name        = collaplex_dsp_in
                node.description = "Collaplex RT DSP 接入"
                audio.channels   = 2
                audio.position   = [ FL FR ]
                node.always-process = true
                node.pause-on-idle  = false
            }
            playback.props = {
                node.name        = collaplex_dsp_out
                audio.channels   = 2
                audio.position   = [ FL FR ]
                node.target      = "__TARGET__"
                node.always-process = true
                node.pause-on-idle  = false
            }
        }
    }
]
